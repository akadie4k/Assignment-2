<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyML & Edge AI Interactive Workbench & Benchmark Simulator</title>
    
    <!-- Tailwind CSS loaded via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM for structured reactive state -->
    <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Chart.js for Canvas-based charts (NO SVG) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    
    <!-- jsPDF for generating grade certificate PDF client-side -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Style Tweaks for Chart Containers and Canvas bounds -->
    <style>
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            height: 240px;
            max-height: 280px;
        }
        @media (min-width: 768px) {
            .chart-container {
                height: 260px;
            }
        }
        /* Custom scrollbar for lab logging */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;

        // ==========================================
        // 1. SIMULATION & PHYSICS ENGINE
        // ==========================================
        class SimulationEngine {
            static calculate(algo, dataType, sizeScale, infRateHz, systemTemp = 25, batteryLevel = 100, customModel = null, sensorModality = 'image') {
                const models = {
                    kws: { baseFlash: 25, baseSram: 15, baseOps: 100, simd: 0.9, fpu: 1.2 },
                    vww: { baseFlash: 250, baseSram: 120, baseOps: 800, simd: 1.0, fpu: 1.0 },
                    ad:  { baseFlash: 260, baseSram: 40, baseOps: 300, simd: 0.8, fpu: 1.5 },
                    custom: customModel || { baseFlash: 100, baseSram: 50, baseOps: 200, simd: 1.0, fpu: 1.0 }
                };

                const profile = models[algo] || models.kws;
                
                const sensorCosts = {
                    image: { sramBuffer: 30, preprocOps: 40 },
                    audio: { sramBuffer: 16, preprocOps: 150 },
                    imu:   { sramBuffer: 2, preprocOps: 5 }
                };
                const sensor = sensorCosts[sensorModality] || sensorCosts.image;
                
                const bytesPerElement = dataType === 'int8' ? 1 : 4;
                const sramUsed = (profile.baseSram * sizeScale * (bytesPerElement/2)) + sensor.sramBuffer;
                const flashUsed = profile.baseFlash * sizeScale * (bytesPerElement/2);

                const thermalPenalty = systemTemp > 65 ? 1.35 : 1.0;

                let m0Penalty = dataType === 'float32' ? 15.0 : 2.5; 
                let m4Penalty = dataType === 'float32' ? 1.5 : (2.0 - profile.simd);
                let espPenalty = dataType === 'float32' ? 0.8 : (1.0 - profile.simd * 0.5);

                const totalOps = (profile.baseOps * sizeScale) + sensor.preprocOps;

                const m0TimeMs = ((totalOps * m0Penalty) / 100) * thermalPenalty;
                const m4TimeMs = ((totalOps * m4Penalty) / 150) * thermalPenalty;
                const espTimeMs = ((totalOps * espPenalty) / 240) * thermalPenalty;

                const calcEnergyAndBattery = (timeMs, active_mA, sleep_mA) => {
                    const voltage = 3.3;
                    const windowMs = 1000 / infRateHz;
                    
                    if (timeMs > windowMs) return { active: 0, sleep: 0, total: 0, overload: true, battDays: 0 };
                    
                    const sleepMs = windowMs - timeMs;
                    const active_uJ = voltage * active_mA * (timeMs * 1000);
                    const sleep_uJ = voltage * sleep_mA * (sleepMs * 1000);
                    
                    const avgCurrent_mA = ((timeMs * active_mA) + (sleepMs * sleep_mA)) / windowMs;
                    const remainingCapacity_mAh = 500 * (batteryLevel / 100);
                    const remainingHours = remainingCapacity_mAh / (avgCurrent_mA || 0.001);
                    const battDays = remainingHours / 24;

                    return { 
                        active: active_uJ, sleep: sleep_uJ, total: active_uJ + sleep_uJ, overload: false,
                        battDays, throttled: thermalPenalty > 1.0, avgCurrent_mA
                    };
                };

                return [
                    {
                        id: 'pico', name: 'Rasp Pi Pico', arch: 'Cortex-M0+', color: '#3b82f6',
                        sramLimit: 264, flashLimit: 2048,
                        sramUsed, flashUsed,
                        timeMedian: m0TimeMs, timeP95: m0TimeMs * 1.08, timeFirst: m0TimeMs * 2.1,
                        energy: calcEnergyAndBattery(m0TimeMs, 30, 1.5)
                    },
                    {
                        id: 'm4', name: 'STM32F4', arch: 'Cortex-M4', color: '#10b981',
                        sramLimit: 192, flashLimit: 1024,
                        sramUsed, flashUsed,
                        timeMedian: m4TimeMs, timeP95: m4TimeMs * 1.05, timeFirst: m4TimeMs * 1.5,
                        energy: calcEnergyAndBattery(m4TimeMs, 50, 2.0)
                    },
                    {
                        id: 'esp', name: 'ESP32-S3', arch: 'Xtensa LX7', color: '#f59e0b',
                        sramLimit: 512, flashLimit: 8192,
                        sramUsed, flashUsed,
                        timeMedian: espTimeMs, timeP95: espTimeMs * 1.05, timeFirst: espTimeMs * 2.8,
                        energy: calcEnergyAndBattery(espTimeMs, 90, 0.8)
                    }
                ];
            }
        }

        // ==========================================
        // 2. DATASETS & SENSOR VISUALIZERS (CANVAS)
        // ==========================================
        const sampleDatasets = {
            image: {
                image_motor: { name: 'Target: Industrial Motor', desc: 'Positive class for Visual Wake Words (30KB buffer)' },
                image_empty: { name: 'Background: Empty Floor', desc: 'Negative background baseline class (30KB buffer)' }
            },
            audio: {
                audio_speech: { name: 'Speech Command: "Start"', desc: 'High-energy speech phonemes requiring FFT DSP' },
                audio_noise: { name: 'Factory Noise Baseline', desc: 'Continuous low-amplitude industrial rumble' }
            },
            imu: {
                imu_normal: { name: 'Normal Motor Vibration', desc: 'Predictable sinusoidal harmonic frequencies' },
                imu_anomaly: { name: 'Bearing Failure Impact', desc: 'Erratic transient high-g impact spikes' }
            }
        };

        const SensorCanvasVisualizer = ({ modality, datasetId }) => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let step = 0;

                const render = () => {
                    step++;
                    const w = canvas.width;
                    const h = canvas.height;
                    ctx.clearRect(0, 0, w, h);

                    if (modality === 'image') {
                        ctx.fillStyle = '#1e293b';
                        ctx.fillRect(0, 0, w, h);

                        const cols = 16;
                        const rows = 10;
                        const cellW = w / cols;
                        const cellH = h / rows;

                        for (let r = 0; r < rows; r++) {
                            for (let c = 0; c < cols; c++) {
                                const isMotor = datasetId === 'image_motor' && (c > 4 && c < 11 && r > 2 && r < 8);
                                const val = isMotor 
                                    ? Math.floor(140 + Math.sin(step/10 + c) * 50) 
                                    : Math.floor(40 + Math.sin(step/15 + r) * 20);
                                ctx.fillStyle = `rgb(${val}, ${val + 10}, ${val + 20})`;
                                ctx.fillRect(c * cellW + 1, r * cellH + 1, cellW - 2, cellH - 2);
                            }
                        }

                        const scanY = (step * 2) % h;
                        ctx.strokeStyle = '#6366f1';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.moveTo(0, scanY);
                        ctx.lineTo(w, scanY);
                        ctx.stroke();

                        ctx.fillStyle = 'rgba(99, 102, 241, 0.2)';
                        ctx.fillRect(0, Math.max(0, scanY - 15), w, 15);

                    } else if (modality === 'audio') {
                        ctx.fillStyle = '#0f172a';
                        ctx.fillRect(0, 0, w, h);

                        const numBars = 24;
                        const barWidth = w / numBars;
                        const isSpeech = datasetId === 'audio_speech';

                        for (let i = 0; i < numBars; i++) {
                            let heightPct = 0.15;
                            if (isSpeech) {
                                const cycle = (step + i * 2) % 40;
                                const speechVol = cycle < 20 ? Math.sin(cycle / 20 * Math.PI) : 0.1;
                                heightPct = Math.min(0.95, speechVol * (1 - i / 30) + Math.random() * 0.1);
                            } else {
                                heightPct = 0.1 + Math.random() * 0.15;
                            }

                            const barH = heightPct * (h - 20);
                            const x = i * barWidth;
                            const y = h - barH;

                            const gradient = ctx.createLinearGradient(0, h, 0, 0);
                            gradient.addColorStop(0, '#059669');
                            gradient.addColorStop(0.6, '#10b981');
                            gradient.addColorStop(1, '#34d399');

                            ctx.fillStyle = gradient;
                            ctx.fillRect(x + 2, y, barWidth - 4, barH);
                        }

                    } else if (modality === 'imu') {
                        ctx.fillStyle = '#0f2027';
                        ctx.fillRect(0, 0, w, h);

                        ctx.strokeStyle = '#334155';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(0, h/2); ctx.lineTo(w, h/2);
                        ctx.stroke();

                        const isAnomaly = datasetId === 'imu_anomaly';
                        const timeShift = step * 0.05;

                        const drawAxis = (color, freqMult, ampMult, phase) => {
                            ctx.strokeStyle = color;
                            ctx.lineWidth = 2;
                            ctx.beginPath();
                            for (let x = 0; x < w; x += 3) {
                                const t = timeShift + (x * 0.02);
                                let noise = Math.sin(t * freqMult + phase) * ampMult;
                                if (isAnomaly && (x > w*0.6 && x < w*0.75)) {
                                    noise += (Math.random() - 0.5) * 45;
                                }
                                const y = (h / 2) + noise;
                                if (x === 0) ctx.moveTo(x, y);
                                else ctx.lineTo(x, y);
                            }
                            ctx.stroke();
                        };

                        drawAxis('#ef4444', 3, 20, 0);   
                        drawAxis('#3b82f6', 2, 15, 1.5); 
                        drawAxis('#10b981', 4, 10, 3.0); 
                    }

                    animationFrameId = requestAnimationFrame(render);
                };

                render();

                return () => cancelAnimationFrame(animationFrameId);
            }, [modality, datasetId]);

            const dataset = sampleDatasets[modality][datasetId];

            return (
                <div className="w-full space-y-2">
                    <div className="bg-slate-50 p-2.5 rounded-lg border border-slate-200 text-xs flex justify-between items-center">
                        <div>
                            <span className="font-bold text-slate-800 block">{dataset?.name}</span>
                            <span className="text-slate-500">{dataset?.desc}</span>
                        </div>
                        <span className="text-[10px] font-mono bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded font-semibold border border-indigo-200 uppercase">
                            {modality} Feed
                        </span>
                    </div>

                    <div className="relative w-full h-32 rounded-lg overflow-hidden border border-slate-300 shadow-inner bg-slate-900">
                        <canvas ref={canvasRef} width={420} height={128} className="w-full h-full block" />
                        <div className="absolute bottom-1.5 right-2 bg-slate-900/80 backdrop-blur text-[10px] px-2 py-0.5 rounded text-slate-200 font-mono border border-slate-700">
                            {modality === 'image' && '📷 30KB SRAM Input Buffer | 40 M-Ops'}
                            {modality === 'audio' && '🎙️ 16KB SRAM Input Buffer | 150 M-Ops (FFT DSP)'}
                            {modality === 'imu'   && '⏱️ 2KB SRAM Input Buffer  | 5 M-Ops Math'}
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 3. CHART.JS CONTAINER COMPONENT
        // ==========================================
        const BenchmarkCharts = ({ results, infRateHz }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (!chartRef.current) return;

                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const ctx = chartRef.current.getContext('2d');
                
                const labels = results.map(r => r.name);
                const medianTimes = results.map(r => r.energy.overload ? 0 : Number(r.timeMedian.toFixed(1)));
                const p95Times = results.map(r => r.energy.overload ? 0 : Number(r.timeP95.toFixed(1)));
                const deadlineWindow = 1000 / infRateHz;

                chartInstance.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: 'Median Latency (ms)',
                                data: medianTimes,
                                backgroundColor: '#3b82f6',
                                borderRadius: 4
                            },
                            {
                                label: 'P95 Latency (ms)',
                                data: p95Times,
                                backgroundColor: '#f59e0b',
                                borderRadius: 4
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } },
                            tooltip: {
                                callbacks: {
                                    afterBody: (items) => `Target Deadline: ${deadlineWindow.toFixed(1)} ms`
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: { display: true, text: 'Milliseconds (ms)', font: { size: 10 } }
                            }
                        }
                    }
                });

                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, [results, infRateHz]);

            return (
                <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2">
                    <h3 className="text-sm font-bold text-slate-800 flex justify-between items-center">
                        <span>Latency Benchmarking (Median vs P95)</span>
                        <span className="text-xs font-normal text-slate-500">Deadline Target: {(1000/infRateHz).toFixed(1)} ms</span>
                    </h3>
                    <div className="chart-container">
                        <canvas ref={chartRef}></canvas>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 4. MAIN APPLICATION COMPONENT
        // ==========================================
        const App = () => {
            const [activeTab, setActiveTab] = useState('simulator'); // 'simulator', 'scenarios', 'lab', 'reference'
            
            // Simulator State
            const [algo, setAlgo] = useState('vww');
            const [dataType, setDataType] = useState('int8');
            const [sizeScale, setSizeScale] = useState(1.0);
            const [infRateHz, setInfRateHz] = useState(10);
            
            const [ambientTemp, setAmbientTemp] = useState(25);
            const [batteryLevel, setBatteryLevel] = useState(100);
            const [sensorModality, setSensorModality] = useState('image');
            const [datasetId, setDatasetId] = useState('image_motor');

            const [customModel, setCustomModel] = useState({ baseFlash: 180, baseSram: 160, baseOps: 600, simd: 1.0, fpu: 1.0 });

            // AI Professor State
            const [aiNote, setAiNote] = useState('');
            const [loadingAi, setLoadingAi] = useState(false);

            // Student Identification & Lab Assessment State
            const [studentName, setStudentName] = useState('');
            const [studentId, setStudentId] = useState('');
            
            const [labAnswers, setLabAnswers] = useState({
                // Q1 & Q2: observation — student enters numerical values they read from the simulator
                q1_num: '',           // Q1 STM32F4 SRAM reading (1 pt)
                q1_verified: false,   // Q1 config verified before grading
                q2_num: '',           // Q2 ESP32-S3 latency reading (1 pt)
                q2_verified: false,   // Q2 config verified

                // Q3 & Q4: analysis — numerical answers derived from simulator observation
                q3_num: '',           // Q3 Flash reduction % (2 pt)
                q4_num: '',           // Q4 Audio-IMU M-Ops diff (2 pt)

                // Q5-Q8: pure design tasks — verified by inspecting live simulator state
                q5_verified: false,   // Q5 Fit custom model (2 pt)
                q6_verified: false,   // Q6 Pico latency deadline (2 pt)
                q7_verified: false,   // Q7 Escape thermal throttling (2 pt)
                q8_verified: false,   // Q8 Battery life ≥ 24 days (2 pt)

                // Q9: multi-part MCQ (3 pt total)
                q9a: '',              // Q9a Winner at 25 Hz (1 pt)
                q9b: '',              // Q9b Winner at 2 Hz (1 pt)
                q9c: '',              // Q9c Reason (1 pt)

                // Q10: capstone — verified by full-state check (3 pt)
                q10_verified: false,
            });

            const [submittedLab, setSubmittedLab] = useState(false);
            const [evalScore, setEvalScore] = useState(null);

            // Handle Sensor Change
            const handleModalityChange = (mod) => {
                setSensorModality(mod);
                if (mod === 'image') setDatasetId('image_motor');
                if (mod === 'audio') setDatasetId('audio_speech');
                if (mod === 'imu') setDatasetId('imu_normal');
            };

            // Calculate Dynamic Heat Delta
            const baseOpsMap = { kws: 100, vww: 800, ad: 300, custom: customModel.baseOps };
            const sensorOpsMap = { image: 40, audio: 150, imu: 5 };
            const activeBaseOps = baseOpsMap[algo] || 100;
            const activePreproc = sensorOpsMap[sensorModality] || 0;
            const totalOps = (activeBaseOps * sizeScale) + activePreproc;
            const totalOpsPerSec = totalOps * infRateHz;
            
            const heatDelta = (totalOpsPerSec / 80000) * 35; 
            const systemTemp = ambientTemp + heatDelta;

            // Compute Engine Results
            const results = useMemo(() => 
                SimulationEngine.calculate(algo, dataType, sizeScale, infRateHz, systemTemp, batteryLevel, customModel, sensorModality),
                [algo, dataType, sizeScale, infRateHz, systemTemp, batteryLevel, customModel, sensorModality]
            );

            // Real-Time Ticking Battery Drain Loop
            const m4TimeMs = ((totalOps * 1.0) / 150) * (systemTemp > 65 ? 1.35 : 1.0);
            const windowMs = 1000 / infRateHz;
            let currentDrainRate = 0;
            if (m4TimeMs > windowMs) {
                currentDrainRate = 1.8;
            } else {
                const sleepMs = windowMs - m4TimeMs;
                const avgCurrent_mA = ((m4TimeMs * 50) + (sleepMs * 2.0)) / windowMs;
                const totalHours = 500 / avgCurrent_mA;
                currentDrainRate = (100 / totalHours) * 1.5;
            }

            const drainRef = useRef(currentDrainRate);
            useEffect(() => { drainRef.current = currentDrainRate; }, [currentDrainRate]);

            useEffect(() => {
                const interval = setInterval(() => {
                    setBatteryLevel(prev => {
                        if (prev <= 0) return 0;
                        const next = prev - (drainRef.current / 10);
                        return next > 0 ? next : 0;
                    });
                }, 100);
                return () => clearInterval(interval);
            }, []);

            // Auto Preset Loader for Engineering Scenarios
            const loadScenarioPreset = (scenarioNum) => {
                setActiveTab('simulator');
                if (scenarioNum === 1) {
                    setAlgo('vww');
                    setSensorModality('image');
                    setDatasetId('image_motor');
                    setInfRateHz(1);
                    setDataType('float32');
                    setSizeScale(1.0);
                    setAmbientTemp(25);
                } else if (scenarioNum === 2) {
                    setAlgo('kws');
                    setSensorModality('audio');
                    setDatasetId('audio_speech');
                    setDataType('int8');
                    setSizeScale(1.0);
                    setInfRateHz(10);
                    setAmbientTemp(25);
                } else if (scenarioNum === 3) {
                    setAlgo('ad');
                    setSensorModality('imu');
                    setDatasetId('imu_normal');
                    setInfRateHz(45);
                    setAmbientTemp(43);
                    setSizeScale(1.5);
                    setDataType('int8');
                } else if (scenarioNum === 4) {
                    setAlgo('kws');
                    setSensorModality('audio');
                    setDatasetId('audio_speech');
                    setDataType('int8');
                    setInfRateHz(25);
                    setAmbientTemp(25);
                } else if (scenarioNum === 5) {
                    setAlgo('custom');
                    setCustomModel({ baseFlash: 180, baseSram: 160, baseOps: 600, simd: 1.0, fpu: 1.0 });
                    setSensorModality('image');
                    setDatasetId('image_motor');
                    setInfRateHz(15);
                    setDataType('int8');
                }
            };

            const getProfessorInsight = () => {
                if (sensorModality === 'audio' && dataType === 'float32') 
                    return "⚠️ Audio DSP Penalty: Calculating audio MFCC features via FFT in float32 without a hardware FPU (like Cortex-M0+) causes massive latency spikes before the neural net even starts!";
                if (sensorModality === 'image' && results[1].sramUsed > results[1].sramLimit) 
                    return "📷 Camera Buffer OOM: Your model weights might fit, but the raw 30KB camera input buffer just pushed the STM32F4's SRAM over its 192KB limit!";
                if (systemTemp > 65) 
                    return "🔥 Thermal Throttling: Heavy compute combined with ambient heat pushed core temp over 65°C! Clock speeds reduced, causing a 35% latency penalty.";
                if (batteryLevel < 15) 
                    return "🔋 Critical Battery: Real-time context suggests lowering target inference rate or switching to int8 to survive.";
                if (dataType === 'float32') 
                    return "🧠 Float Penalty: Without a hardware FPU, the Cortex-M0+ simulates float math in software, multiplying latency by 10x.";
                if (infRateHz <= 5) 
                    return "🔌 Sleep Dominance: At low duty cycles (1-5 Hz), active inference energy is tiny compared to sleep energy. Look at the ESP32-S3's 0.8mA sleep current winning!";
                return "Tweak data modalities, precision, and inference rates to explore real-time hardware bottlenecks.";
            };

            const fetchAiProfessorAnalysis = async () => {
                setLoadingAi(true);
                try {
                    const systemPrompt = "You are an expert embedded systems professor teaching TinyML. Analyze the given MCU simulation configuration and results. Provide a concise, 2-3 sentence educational insight about primary hardware bottlenecks (SRAM OOM, FPU absence, Thermal throttling, Battery duty cycle). Avoid markdown syntax.";
                    const summaryData = results.map(r => ({
                        name: r.name, sramUsed: Math.round(r.sramUsed), sramLimit: r.sramLimit, 
                        latency: Math.round(r.timeMedian), targetWindow: Math.round(1000/infRateHz),
                        energy: Math.round(r.energy.total), battDays: r.energy.battDays ? r.energy.battDays.toFixed(1) : 0
                    }));
                    const userQuery = `Task: ${algo}, Sensor: ${sensorModality}, Precision: ${dataType}, Rate: ${infRateHz}Hz, Temp: ${ambientTemp}C.\nResults: ${JSON.stringify(summaryData)}`;
                    
                    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userQuery }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });
                    const data = await response.json();
                    if (data.candidates && data.candidates[0].content?.parts[0]?.text) {
                        setAiNote(data.candidates[0].content.parts[0].text);
                    } else {
                        setAiNote(getProfessorInsight());
                    }
                } catch (e) {
                    setAiNote(getProfessorInsight());
                }
                setLoadingAi(false);
            };

            // ==========================================
            // LAB VERIFICATION HELPERS — one per interactive question
            // ==========================================

            // Q1 & Q2 shared reference config: VWW · int8 · image · 1.0x · 10 Hz · 25°C ambient
            // These two questions test READING numbers off the simulator with the same reference setup.
            const REF_CONFIG = { algo: 'vww', dataType: 'int8', sensorModality: 'image', sizeScale: 1.0, infRateHz: 10, ambientTemp: 25 };

            const isRefConfig = () => (
                algo === REF_CONFIG.algo &&
                dataType === REF_CONFIG.dataType &&
                sensorModality === REF_CONFIG.sensorModality &&
                Math.abs(sizeScale - REF_CONFIG.sizeScale) < 0.05 &&
                infRateHz === REF_CONFIG.infRateHz &&
                ambientTemp === REF_CONFIG.ambientTemp
            );

            const refConfigDiagnostic = () => {
                const problems = [];
                if (algo !== 'vww') problems.push(`Task must be Visual Wake Words (current: ${algo})`);
                if (dataType !== 'int8') problems.push(`Precision must be int8 (current: ${dataType})`);
                if (sensorModality !== 'image') problems.push(`Sensor must be Image (current: ${sensorModality})`);
                if (Math.abs(sizeScale - 1.0) >= 0.05) problems.push(`Size Scale must be 1.0x (current: ${sizeScale.toFixed(1)}x)`);
                if (infRateHz !== 10) problems.push(`Inference Rate must be 10 Hz (current: ${infRateHz} Hz)`);
                if (ambientTemp !== 25) problems.push(`Ambient Temp must be 25°C (current: ${ambientTemp}°C)`);
                return problems;
            };

            // Q1: verify config, then check student's SRAM number against live STM32F4 reading
            const verifyQ1 = () => {
                const probs = refConfigDiagnostic();
                if (probs.length > 0) {
                    alert('❌ Q1: Please set the reference configuration on Tab 1 first.\n\nProblems:\n• ' + probs.join('\n• '));
                    return;
                }
                const expected = results[1].sramUsed;
                const answered = parseFloat(labAnswers.q1_num);
                if (isNaN(answered)) {
                    alert('❌ Q1: Please enter your SRAM reading first.');
                    return;
                }
                // ±5% tolerance
                if (Math.abs(answered - expected) / expected <= 0.05) {
                    setLabAnswers(prev => ({ ...prev, q1_verified: true }));
                    alert(`✅ Q1 verified! You read STM32F4 SRAM correctly.\n\nYour answer: ${answered} KB\nSimulator reading: ${expected.toFixed(1)} KB\n\n+1 point will be awarded on submission.`);
                } else {
                    setLabAnswers(prev => ({ ...prev, q1_verified: false }));
                    alert(`❌ Q1: Your number (${answered} KB) does not match the STM32F4 SRAM reading on the simulator.\n\nLook at the middle board's SRAM bar in Tab 1 and re-read carefully.`);
                }
            };

            // Q2: same config as Q1 — check ESP32-S3 median latency
            const verifyQ2 = () => {
                const probs = refConfigDiagnostic();
                if (probs.length > 0) {
                    alert('❌ Q2: Please set the reference configuration on Tab 1 first.\n\nProblems:\n• ' + probs.join('\n• '));
                    return;
                }
                const expected = results[2].timeMedian;
                const answered = parseFloat(labAnswers.q2_num);
                if (isNaN(answered)) {
                    alert('❌ Q2: Please enter your latency reading first.');
                    return;
                }
                // ±0.2 ms absolute tolerance since small numbers
                if (Math.abs(answered - expected) <= 0.2) {
                    setLabAnswers(prev => ({ ...prev, q2_verified: true }));
                    alert(`✅ Q2 verified! You read ESP32-S3 median latency correctly.\n\nYour answer: ${answered} ms\nSimulator reading: ${expected.toFixed(2)} ms\n\n+1 point will be awarded on submission.`);
                } else {
                    setLabAnswers(prev => ({ ...prev, q2_verified: false }));
                    alert(`❌ Q2: Your number (${answered} ms) does not match the ESP32-S3 median latency shown on the simulator.\n\nLook at the ESP32-S3 board's "Med ms" value in Tab 1.`);
                }
            };

            // Q5: Custom model must fit STM32F4 with baseFlash=200, baseSram=180
            const verifyQ5 = () => {
                const problems = [];
                if (algo !== 'custom') problems.push('Set Algorithm Task to "Custom Model"');
                if (customModel.baseFlash !== 200) problems.push(`Custom baseFlash must be exactly 200 KB (current: ${customModel.baseFlash})`);
                if (customModel.baseSram !== 180) problems.push(`Custom baseSram must be exactly 180 KB (current: ${customModel.baseSram})`);
                if (problems.length > 0) {
                    alert('❌ Q5 setup incomplete:\n• ' + problems.join('\n• ') + '\n\nOn Tab 1: pick "Custom Model", then set Flash=200 and SRAM=180 on the sliders.');
                    return;
                }
                const m4 = results[1];
                const oom = m4.sramUsed > m4.sramLimit || m4.flashUsed > m4.flashLimit;
                if (!oom) {
                    setLabAnswers(prev => ({ ...prev, q5_verified: true }));
                    alert(`✅ Q5 verified! Your custom model fits STM32F4.\n\nSRAM used: ${m4.sramUsed.toFixed(0)} / ${m4.sramLimit} KB\nFlash used: ${m4.flashUsed.toFixed(0)} / ${m4.flashLimit} KB\n\n+2 points on submission.`);
                } else {
                    setLabAnswers(prev => ({ ...prev, q5_verified: false }));
                    alert(`❌ Q5: STM32F4 hit OOM.\nSRAM: ${m4.sramUsed.toFixed(0)} / ${m4.sramLimit} KB\nFlash: ${m4.flashUsed.toFixed(0)} / ${m4.flashLimit} KB\n\nHint: try switching Precision to int8 — that halves memory per element.`);
                }
            };

            // Q6: VWW on Pico with median latency < 40 ms
            const verifyQ6 = () => {
                const problems = [];
                if (algo !== 'vww') problems.push('Set Algorithm Task to "Visual Wake Words"');
                if (sensorModality !== 'image') problems.push('Set Sensor to Image (matches VWW use case)');
                if (problems.length > 0) {
                    alert('❌ Q6 setup incomplete:\n• ' + problems.join('\n• '));
                    return;
                }
                const picoLat = results[0].timeMedian;
                if (picoLat < 40 && !results[0].energy.overload) {
                    setLabAnswers(prev => ({ ...prev, q6_verified: true }));
                    alert(`✅ Q6 verified! Pico VWW median latency = ${picoLat.toFixed(1)} ms (< 40 ms)\n\n+2 points on submission.`);
                } else {
                    setLabAnswers(prev => ({ ...prev, q6_verified: false }));
                    alert(`❌ Q6: Pico latency is ${picoLat.toFixed(1)} ms (must be < 40 ms).\n\nHints:\n• Cortex-M0+ has no FPU — float32 costs 15× more than int8 there\n• Try reducing Model Size Multiplier`);
                }
            };

            // Q7: AD at ≥45 Hz, ambient ≥45°C, systemTemp < 65
            const verifyQ7 = () => {
                const problems = [];
                if (algo !== 'ad') problems.push('Set Algorithm Task to "Anomaly Detection"');
                if (infRateHz < 45) problems.push(`Inference Rate must be ≥ 45 Hz (current: ${infRateHz} Hz)`);
                if (ambientTemp < 45) problems.push(`Ambient Temp must be ≥ 45°C (current: ${ambientTemp}°C)`);
                if (problems.length > 0) {
                    alert('❌ Q7 constraints not set:\n• ' + problems.join('\n• '));
                    return;
                }
                if (systemTemp < 65) {
                    setLabAnswers(prev => ({ ...prev, q7_verified: true }));
                    alert(`✅ Q7 verified! Core temp = ${systemTemp.toFixed(1)}°C — no throttling active.\n\n+2 points on submission.`);
                } else {
                    setLabAnswers(prev => ({ ...prev, q7_verified: false }));
                    alert(`❌ Q7: Core temp = ${systemTemp.toFixed(1)}°C (must be < 65°C).\n\nHints:\n• Audio has 150 M-Ops preprocessing — very heat-intensive\n• IMU has only 5 M-Ops preprocessing — much cooler\n• Reduce Model Size Multiplier`);
                }
            };

            // Q8: ESP32-S3 battery ≥ 24 days with KWS + int8
            const verifyQ8 = () => {
                const problems = [];
                if (algo !== 'kws') problems.push('Set Algorithm Task to "Keyword Spotting"');
                if (dataType !== 'int8') problems.push('Set Precision to int8');
                if (problems.length > 0) {
                    alert('❌ Q8 constraints not set:\n• ' + problems.join('\n• '));
                    return;
                }
                if (batteryLevel < 99) {
                    alert('❌ Q8: Battery must be at 100% for this test. Click "Recharge ⚡" on Tab 1 first.');
                    return;
                }
                const espBatt = results[2].energy.battDays;
                if (espBatt >= 24) {
                    setLabAnswers(prev => ({ ...prev, q8_verified: true }));
                    alert(`✅ Q8 verified! ESP32-S3 battery runtime = ${espBatt.toFixed(1)} days (≥ 24)\n\n+2 points on submission.`);
                } else {
                    setLabAnswers(prev => ({ ...prev, q8_verified: false }));
                    alert(`❌ Q8: ESP32-S3 battery = ${espBatt.toFixed(1)} days (must be ≥ 24 days).\n\nHints:\n• At low duty cycles, sleep energy dominates\n• Lower Inference Rate maximises sleep time\n• IMU is the cheapest sensor preprocessing (5 M-Ops)`);
                }
            };

            // Q10 Capstone: multi-constraint solar panel vibration monitor
            const verifyQ10 = () => {
                const problems = [];
                if (algo !== 'ad') problems.push('Algorithm must be Anomaly Detection');
                if (sensorModality !== 'imu') problems.push('Sensor must be IMU (vibration)');
                if (problems.length > 0) {
                    alert('❌ Q10 base setup incomplete:\n• ' + problems.join('\n• '));
                    return;
                }
                const [pico, m4, esp] = results;
                const runtime = [];
                if (pico.timeMedian >= 20 || pico.energy.overload) runtime.push(`Pico latency ${pico.timeMedian.toFixed(1)} ms (must be < 20)`);
                if (m4.timeMedian >= 20 || m4.energy.overload) runtime.push(`STM32F4 latency ${m4.timeMedian.toFixed(1)} ms (must be < 20)`);
                if (esp.timeMedian >= 20 || esp.energy.overload) runtime.push(`ESP32-S3 latency ${esp.timeMedian.toFixed(1)} ms (must be < 20)`);
                if (systemTemp >= 60) runtime.push(`Core temp ${systemTemp.toFixed(1)}°C (safety limit 60°C)`);
                if (m4.energy.battDays < 5) runtime.push(`STM32F4 battery ${m4.energy.battDays.toFixed(1)} days (must be ≥ 5)`);
                if (pico.sramUsed > pico.sramLimit) runtime.push('Pico SRAM OOM');
                if (m4.sramUsed > m4.sramLimit) runtime.push('STM32F4 SRAM OOM');
                if (esp.sramUsed > esp.sramLimit) runtime.push('ESP32-S3 SRAM OOM');

                if (runtime.length === 0) {
                    setLabAnswers(prev => ({ ...prev, q10_verified: true }));
                    alert(`✅ Q10 CAPSTONE PASSED! You designed a working Solar Panel Vibration Monitor.\n\nAll 6 constraints met:\n• All three boards < 20 ms latency\n• Core temp ${systemTemp.toFixed(1)}°C (< 60°C)\n• STM32F4 battery ${m4.energy.battDays.toFixed(1)} days (≥ 5)\n• No memory overflow anywhere\n\n+3 points on submission.`);
                } else {
                    setLabAnswers(prev => ({ ...prev, q10_verified: false }));
                    alert('❌ Q10 constraints not all met:\n• ' + runtime.join('\n• ') + '\n\nAdjust size, sensor, precision, or inference rate and try again.');
                }
            };

            // Grade Evaluation — 10 questions, 20 points total
            const evaluateAssignment = () => {
                if (!studentName.trim() || !studentId.trim()) {
                    alert("Please enter both Student Full Name and Student ID before submitting your lab!");
                    return;
                }

                let score = 0;
                const breakdown = [];

                // Q1 (1 pt): verified observation of STM32F4 SRAM
                if (labAnswers.q1_verified) { score += 1; breakdown.push('Q1 ✓ +1'); } else breakdown.push('Q1 ✗ 0');

                // Q2 (1 pt): verified observation of ESP32-S3 latency
                if (labAnswers.q2_verified) { score += 1; breakdown.push('Q2 ✓ +1'); } else breakdown.push('Q2 ✗ 0');

                // Q3 (2 pt): Flash reduction % — accept 70-80
                {
                    const v = parseFloat(labAnswers.q3_num);
                    if (!isNaN(v) && v >= 70 && v <= 80) { score += 2; breakdown.push('Q3 ✓ +2'); } else breakdown.push('Q3 ✗ 0');
                }

                // Q4 (2 pt): Audio-IMU M-Ops diff = 145
                {
                    const v = parseFloat(labAnswers.q4_num);
                    if (!isNaN(v) && v >= 140 && v <= 150) { score += 2; breakdown.push('Q4 ✓ +2'); } else breakdown.push('Q4 ✗ 0');
                }

                // Q5 (2 pt): custom model fits STM32F4
                if (labAnswers.q5_verified) { score += 2; breakdown.push('Q5 ✓ +2'); } else breakdown.push('Q5 ✗ 0');

                // Q6 (2 pt): Pico VWW < 40 ms
                if (labAnswers.q6_verified) { score += 2; breakdown.push('Q6 ✓ +2'); } else breakdown.push('Q6 ✗ 0');

                // Q7 (2 pt): escape thermal throttling
                if (labAnswers.q7_verified) { score += 2; breakdown.push('Q7 ✓ +2'); } else breakdown.push('Q7 ✗ 0');

                // Q8 (2 pt): ESP32-S3 battery ≥ 24 days
                if (labAnswers.q8_verified) { score += 2; breakdown.push('Q8 ✓ +2'); } else breakdown.push('Q8 ✗ 0');

                // Q9 (3 pt): three MCQ sub-questions, 1 pt each
                if (labAnswers.q9a === 'esp') { score += 1; breakdown.push('Q9a ✓ +1'); } else breakdown.push('Q9a ✗ 0');
                if (labAnswers.q9b === 'esp') { score += 1; breakdown.push('Q9b ✓ +1'); } else breakdown.push('Q9b ✗ 0');
                if (labAnswers.q9c === 'sleep_dominates') { score += 1; breakdown.push('Q9c ✓ +1'); } else breakdown.push('Q9c ✗ 0');

                // Q10 (3 pt): capstone multi-constraint design
                if (labAnswers.q10_verified) { score += 3; breakdown.push('Q10 ✓ +3'); } else breakdown.push('Q10 ✗ 0');

                setEvalScore(score);
                setSubmittedLab(true);
                console.log('Grade breakdown:', breakdown.join(', '));
            };

            // Compute the per-question breakdown used by both on-screen results and PDF export
            const computeBreakdown = () => {
                const rows = [
                    { id: 'Q1',  desc: 'Read STM32F4 SRAM',        earned: labAnswers.q1_verified ? 1 : 0, max: 1 },
                    { id: 'Q2',  desc: 'Read ESP32-S3 latency',    earned: labAnswers.q2_verified ? 1 : 0, max: 1 },
                    { id: 'Q3',  desc: 'Flash quantisation %',     earned: (!isNaN(parseFloat(labAnswers.q3_num)) && parseFloat(labAnswers.q3_num) >= 70 && parseFloat(labAnswers.q3_num) <= 80) ? 2 : 0, max: 2 },
                    { id: 'Q4',  desc: 'Audio-IMU M-Ops diff',     earned: (!isNaN(parseFloat(labAnswers.q4_num)) && parseFloat(labAnswers.q4_num) >= 140 && parseFloat(labAnswers.q4_num) <= 150) ? 2 : 0, max: 2 },
                    { id: 'Q5',  desc: 'Fit custom model',         earned: labAnswers.q5_verified ? 2 : 0, max: 2 },
                    { id: 'Q6',  desc: 'Pico VWW < 40 ms',         earned: labAnswers.q6_verified ? 2 : 0, max: 2 },
                    { id: 'Q7',  desc: 'Escape thermal throttling',earned: labAnswers.q7_verified ? 2 : 0, max: 2 },
                    { id: 'Q8',  desc: 'ESP32-S3 batt >= 24 days', earned: labAnswers.q8_verified ? 2 : 0, max: 2 },
                    { id: 'Q9a', desc: 'Winner @ 25 Hz',           earned: labAnswers.q9a === 'esp' ? 1 : 0, max: 1 },
                    { id: 'Q9b', desc: 'Winner @ 2 Hz',            earned: labAnswers.q9b === 'esp' ? 1 : 0, max: 1 },
                    { id: 'Q9c', desc: 'Sleep-current reason',     earned: labAnswers.q9c === 'sleep_dominates' ? 1 : 0, max: 1 },
                    { id: 'Q10', desc: 'Capstone design',          earned: labAnswers.q10_verified ? 3 : 0, max: 3 },
                ];
                return rows;
            };

            // Deterministic verification hash — same inputs always produce the same hash.
            // Allows the instructor to spot-check whether a downloaded PDF was hand-edited.
            const computeHash = (name, id, score, timestamp) => {
                const str = `${name.trim().toLowerCase()}|${id.trim()}|${score}|${timestamp}`;
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    const chr = str.charCodeAt(i);
                    hash = ((hash << 5) - hash) + chr;
                    hash |= 0; // 32-bit
                }
                return `TML-${Math.abs(hash).toString(36).toUpperCase().padStart(7, '0')}`;
            };

            // Generate a formatted single-page PDF certificate using jsPDF
            const downloadCertificatePDF = () => {
                if (!window.jspdf || !window.jspdf.jsPDF) {
                    alert('PDF library still loading — please try again in a moment.');
                    return;
                }
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

                const pageW = 210;
                const marginX = 20;
                const timestamp = new Date().toLocaleString();
                const hash = computeHash(studentName, studentId, evalScore, timestamp);
                const rows = computeBreakdown();

                // Border frame
                doc.setDrawColor(79, 70, 229); // indigo
                doc.setLineWidth(0.8);
                doc.rect(10, 10, pageW - 20, 277);
                doc.setLineWidth(0.2);
                doc.rect(12, 12, pageW - 24, 273);

                // Header band
                doc.setFillColor(30, 27, 75); // deep indigo
                doc.rect(12, 12, pageW - 24, 22, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(11);
                doc.text('COURSE ASSESSMENT · TINYML & MCU ARCHITECTURE', pageW / 2, 21, { align: 'center' });
                doc.setFontSize(15);
                doc.text('Lab Grade Certificate', pageW / 2, 29, { align: 'center' });

                // Student block
                doc.setTextColor(30, 30, 40);
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(10);
                let y = 46;
                doc.text('STUDENT NAME', marginX, y);
                doc.text('STUDENT ID', marginX + 90, y);
                y += 6;
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(13);
                doc.text(studentName || '(not entered)', marginX, y);
                doc.text(studentId || '(not entered)', marginX + 90, y);

                // Score panel — the centrepiece
                y += 15;
                doc.setFillColor(238, 242, 255); // indigo-50
                doc.setDrawColor(79, 70, 229);
                doc.setLineWidth(0.4);
                doc.roundedRect(marginX, y, pageW - 2 * marginX, 32, 3, 3, 'FD');
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(10);
                doc.setTextColor(80, 80, 100);
                doc.text('TOTAL SCORE', pageW / 2, y + 9, { align: 'center' });
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(32);
                doc.setTextColor(79, 70, 229);
                doc.text(`${evalScore} / 20`, pageW / 2, y + 24, { align: 'center' });

                // Per-question breakdown table
                y += 42;
                doc.setTextColor(30, 30, 40);
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(11);
                doc.text('Per-Question Breakdown', marginX, y);
                y += 4;
                doc.setDrawColor(200, 200, 210);
                doc.line(marginX, y, pageW - marginX, y);
                y += 6;

                doc.setFont('helvetica', 'bold');
                doc.setFontSize(9);
                doc.setTextColor(90, 90, 110);
                doc.text('QUESTION', marginX, y);
                doc.text('DESCRIPTION', marginX + 22, y);
                doc.text('EARNED', pageW - marginX - 30, y, { align: 'right' });
                doc.text('MAX', pageW - marginX, y, { align: 'right' });
                y += 3;
                doc.setDrawColor(220, 220, 230);
                doc.line(marginX, y, pageW - marginX, y);
                y += 5;

                doc.setFont('helvetica', 'normal');
                doc.setFontSize(10);
                rows.forEach((r) => {
                    const isFull = r.earned === r.max;
                    if (isFull) doc.setTextColor(21, 128, 61); // green
                    else if (r.earned > 0) doc.setTextColor(202, 138, 4); // amber
                    else doc.setTextColor(150, 150, 160); // grey
                    doc.setFont('helvetica', 'bold');
                    doc.text(r.id, marginX, y);
                    doc.setFont('helvetica', 'normal');
                    doc.setTextColor(60, 60, 80);
                    doc.text(r.desc, marginX + 22, y);
                    doc.setFont('helvetica', 'bold');
                    if (isFull) doc.setTextColor(21, 128, 61);
                    else if (r.earned > 0) doc.setTextColor(202, 138, 4);
                    else doc.setTextColor(180, 80, 80);
                    doc.text(String(r.earned), pageW - marginX - 30, y, { align: 'right' });
                    doc.setTextColor(120, 120, 130);
                    doc.setFont('helvetica', 'normal');
                    doc.text(String(r.max), pageW - marginX, y, { align: 'right' });
                    y += 7;
                });

                // Divider then totals
                y += 2;
                doc.setDrawColor(200, 200, 210);
                doc.line(marginX, y, pageW - marginX, y);
                y += 7;
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(11);
                doc.setTextColor(30, 30, 40);
                doc.text('TOTAL', marginX, y);
                doc.text(String(evalScore), pageW - marginX - 30, y, { align: 'right' });
                doc.setTextColor(120, 120, 130);
                doc.text('20', pageW - marginX, y, { align: 'right' });

                // Verification block
                y += 20;
                doc.setFillColor(248, 250, 252); // slate-50
                doc.setDrawColor(200, 200, 210);
                doc.setLineWidth(0.2);
                doc.roundedRect(marginX, y, pageW - 2 * marginX, 28, 2, 2, 'FD');
                y += 7;
                doc.setFontSize(8);
                doc.setFont('courier', 'normal');
                doc.setTextColor(80, 80, 100);
                doc.text('SUBMITTED AT:', marginX + 5, y);
                doc.setTextColor(30, 30, 40);
                doc.setFont('courier', 'bold');
                doc.text(timestamp, marginX + 40, y);
                y += 5;
                doc.setFont('courier', 'normal');
                doc.setTextColor(80, 80, 100);
                doc.text('VERIFICATION:', marginX + 5, y);
                doc.setFont('courier', 'bold');
                doc.setTextColor(79, 70, 229);
                doc.text(hash, marginX + 40, y);
                y += 5;
                doc.setFont('helvetica', 'italic');
                doc.setFontSize(7);
                doc.setTextColor(120, 120, 130);
                doc.text('This hash is a deterministic function of student ID, score, and timestamp. Instructor may verify authenticity.', marginX + 5, y);

                // Footer
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(8);
                doc.setTextColor(150, 150, 160);
                doc.text('TinyML & Edge AI Interactive Workbench · Instructor-issued lab certificate', pageW / 2, 280, { align: 'center' });

                // Save with a sensible filename
                const safeName = (studentName || 'student').replace(/[^a-zA-Z0-9]+/g, '_');
                const safeId = (studentId || 'noID').replace(/[^a-zA-Z0-9]+/g, '_');
                doc.save(`TinyML_Lab_Grade_${safeName}_${safeId}.pdf`);
            };

            return (
                <div className="w-full max-w-7xl mx-auto p-4 md:p-6 space-y-6">
                    
                    {/* APP HEADER */}
                    <header className="bg-white rounded-2xl p-5 border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <div className="flex items-center gap-2">
                                <span className="bg-indigo-600 text-white text-xs px-2.5 py-0.5 rounded-full font-bold uppercase tracking-wide">TinyML Lab Engine</span>
                                <span className="text-xs font-mono text-slate-400">v3.3 Grading & Assessment Edition</span>
                            </div>
                            <h1 className="text-2xl md:text-3xl font-extrabold text-slate-900 mt-1">
                                Edge AI & Microcontroller Architecture Workbench
                            </h1>
                            <p className="text-sm text-slate-500 mt-0.5">
                                Interactive physical simulation of Memory, Latency, Thermodynamics, and Battery Duty-Cycling
                            </p>
                        </div>

                        {/* NAVIGATION TABS */}
                        <nav className="flex bg-slate-100 p-1.5 rounded-xl border border-slate-200 text-xs font-semibold gap-1">
                            <button 
                                onClick={() => setActiveTab('simulator')} 
                                className={`px-3.5 py-2 rounded-lg transition-all ${activeTab === 'simulator' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:bg-slate-200/60'}`}
                            >
                                ⚡ Simulator & Benchmarks
                            </button>
                            <button 
                                onClick={() => setActiveTab('scenarios')} 
                                className={`px-3.5 py-2 rounded-lg transition-all ${activeTab === 'scenarios' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:bg-slate-200/60'}`}
                            >
                                🎯 5 Lecture Scenarios
                            </button>
                            <button 
                                onClick={() => setActiveTab('lab')} 
                                className={`px-3.5 py-2 rounded-lg transition-all ${activeTab === 'lab' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-600 hover:bg-slate-200/60'}`}
                            >
                                📝 Graded Student Lab (20 Pts)
                            </button>

                                        <li>MCU core temp stays <strong>below 60°C</strong> (safety margin, not just 65°C)</li>
                                        <li>STM32F4 battery runtime <strong>≥ 5 days</strong></li>
                                        <li>No SRAM or Flash overflow on any board</li>
                                    </ul>
                                    <button onClick={verifyQ10} className={`w-full py-2.5 px-3 rounded text-sm font-bold shadow-md ${labAnswers.q10_verified ? 'bg-emerald-600 text-white' : 'bg-rose-600 hover:bg-rose-700 text-white'}`}>
                                        {labAnswers.q10_verified ? '✅ Capstone Design Verified (+3 pts)' : '🚀 Verify Capstone Design'}
                                    </button>
                                </div>
                            </div>

                            {/* PROGRESS SUMMARY BEFORE SUBMIT */}
                            <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 mt-4">
                                <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wide mb-3">Live progress</h4>
                                <div className="grid grid-cols-2 md:grid-cols-5 gap-2 text-xs">
                                    {[
                                        {n:'Q1', ok: labAnswers.q1_verified, pts:1},
                                        {n:'Q2', ok: labAnswers.q2_verified, pts:1},
                                        {n:'Q3', ok: !isNaN(parseFloat(labAnswers.q3_num)) && parseFloat(labAnswers.q3_num) >= 70 && parseFloat(labAnswers.q3_num) <= 80, pts:2},
                                        {n:'Q4', ok: !isNaN(parseFloat(labAnswers.q4_num)) && parseFloat(labAnswers.q4_num) >= 140 && parseFloat(labAnswers.q4_num) <= 150, pts:2},
                                        {n:'Q5', ok: labAnswers.q5_verified, pts:2},
                                        {n:'Q6', ok: labAnswers.q6_verified, pts:2},
                                        {n:'Q7', ok: labAnswers.q7_verified, pts:2},
                                        {n:'Q8', ok: labAnswers.q8_verified, pts:2},
                                        {n:'Q9', ok: labAnswers.q9a === 'esp' && labAnswers.q9b === 'esp' && labAnswers.q9c === 'sleep_dominates', pts:3},
                                        {n:'Q10', ok: labAnswers.q10_verified, pts:3},
                                    ].map(q => (
                                        <div key={q.n} className={`p-2 rounded border text-center font-mono ${q.ok ? 'bg-emerald-100 border-emerald-300 text-emerald-800' : 'bg-white border-slate-200 text-slate-500'}`}>
                                            <div className="font-bold">{q.n}</div>
                                            <div className="text-[10px]">{q.ok ? `+${q.pts}` : `/ ${q.pts}`}</div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* SUBMIT ASSIGNMENT BUTTON */}
                            <div className="pt-4 border-t border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                                <div className="text-xs text-slate-500">
                                    Total possible: <strong>20 points</strong>. Submit to generate your downloadable PDF certificate.
                                </div>
                                <button 
                                    onClick={evaluateAssignment}
                                    className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm px-6 py-2.5 rounded-lg shadow-md transition-all uppercase tracking-wide"
                                >
                                    Grade & Calculate Assignment Score 🚀
                                </button>
                            </div>

                        </div>
                    )}

                    {/* ========================================== */}
                    {/* TAB 4: ARCHITECTURE MATRIX REFERENCE       */}
                    {/* ========================================== */}
                    {activeTab === 'reference' && (
                        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6">
                            <div>
                                <h2 className="text-xl font-bold text-slate-900">Microcontroller Architecture Reference Matrix</h2>
                                <p className="text-xs text-slate-500 mt-1">Hardware specs, memory limits, and mathematical models used in this simulator.</p>
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-xs text-left border-collapse">
                                    <thead>
                                        <tr className="bg-slate-100 border-b border-slate-200 text-slate-700 uppercase font-bold">
                                            <th className="p-3">Microcontroller</th>
                                            <th className="p-3">Core Arch</th>
                                            <th className="p-3">SRAM Limit</th>
                                            <th className="p-3">Flash Limit</th>
                                            <th className="p-3">Hardware FPU</th>
                                            <th className="p-3">SIMD / Vector</th>
                                            <th className="p-3">Active Current</th>
                                            <th className="p-3">Sleep Current</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100 font-mono">
                                        <tr>
                                            <td className="p-3 font-bold text-blue-600">Raspberry Pi Pico</td>
                                            <td className="p-3">Cortex-M0+</td>
                                            <td className="p-3">264 KB</td>
                                            <td className="p-3">2,048 KB</td>
                                            <td className="p-3 text-red-600 font-bold">❌ Emulated</td>
                                            <td className="p-3 text-red-600 font-bold">❌ None</td>
                                            <td className="p-3">30 mA</td>
                                            <td className="p-3">1.5 mA</td>
                                        </tr>
                                        <tr>
                                            <td className="p-3 font-bold text-emerald-600">STM32F401</td>
                                            <td className="p-3">Cortex-M4</td>
                                            <td className="p-3">192 KB</td>
                                            <td className="p-3">1,024 KB</td>
                                            <td className="p-3 text-emerald-600 font-bold">✅ FPv4-SP</td>
                                            <td className="p-3 text-emerald-600 font-bold">✅ DSP SIMD</td>
                                            <td className="p-3">50 mA</td>
                                            <td className="p-3">2.0 mA</td>
                                        </tr>
                                        <tr>
                                            <td className="p-3 font-bold text-amber-600">ESP32-S3</td>
                                            <td className="p-3">Xtensa LX7</td>
                                            <td className="p-3">512 KB</td>
                                            <td className="p-3">8,192 KB</td>
                                            <td className="p-3 text-emerald-600 font-bold">✅ Hardware</td>
                                            <td className="p-3 text-emerald-600 font-bold">✅ Vector Ext</td>
                                            <td className="p-3">90 mA</td>
                                            <td className="p-3 text-emerald-600 font-bold">0.8 mA (Ultra Low)</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 border-t border-slate-100 text-xs text-slate-700">
                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                                    <h4 className="font-bold text-slate-800 mb-2">Memory Calculation Formulas</h4>
                                    <p className="font-mono text-[11px] bg-white p-2 rounded border border-slate-200 mb-2">
                                        SRAM_Total = (Base_SRAM * SizeScale * (BytesPerElem/2)) + Sensor_Buffer
                                    </p>
                                    <ul className="list-disc pl-4 space-y-1 text-slate-600">
                                        <li><code>int8</code> precision = 1 Byte / Element</li>
                                        <li><code>float32</code> precision = 4 Bytes / Element</li>
                                        <li>Sensor Buffers: Image = 30KB, Audio = 16KB, IMU = 2KB</li>
                                    </ul>
                                </div>

                                <div className="bg-slate-50 p-4 rounded-lg border border-slate-200">
                                    <h4 className="font-bold text-slate-800 mb-2">Thermodynamic & Duty-Cycle Equations</h4>
                                    <p className="font-mono text-[11px] bg-white p-2 rounded border border-slate-200 mb-2">
                                        Energy_Total = (V * I_active * t_infer) + (V * I_sleep * t_sleep)
                                    </p>
                                    <ul className="list-disc pl-4 space-y-1 text-slate-600">
                                        <li>Thermodynamic Heat Delta: +1°C per 2,300 Operations/Sec</li>
                                        <li>Thermal Throttling Penalty: +35% Latency when Core Temp &gt; 65°C</li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
